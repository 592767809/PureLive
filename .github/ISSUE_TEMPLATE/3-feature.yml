name: 功能需求 / Feature request
description: 新功能、改进现有功能、界面和操作体验、新的直播平台。
title: "[需求] "
labels: ["enhancement", "待分类"]
body:
  - type: markdown
    attributes:
      value: |
        需求先登记成“提议”，评估（要解决什么、影响哪些功能、工作量，有界面的先出设计图）后由维护者决定做不做；做的排进计划，不做的说明原因。流程见 [CONTRIBUTING.md](https://github.com/wzgrx/PureLive/blob/master/CONTRIBUTING.md)。

        - 一个 issue 只写一个需求。
        - **请先写清楚要解决的问题和使用场景**，再写希望怎么做：同一个问题常有更好的做法。
        - 不受理：绕过付费、会员或版权限制，下载或转发别人的内容，加广告或收集用户数据。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经在 [Issues](https://github.com/wzgrx/PureLive/issues?q=is%3Aissue) 里搜索过（包括已关闭的），没有相同的需求
          required: true
        - label: 我看过 [功能说明](https://github.com/wzgrx/PureLive#功能详解)，最新版本还没有这个功能
          required: true
        - label: 我看过[决定不做的功能](https://github.com/wzgrx/PureLive/blob/master/docs/V-需求和反馈/V04-不做的/README.md)，这个需求不在里面（或者我有新的理由）
          required: true
        - label: 这个 issue 只写了一个需求
          required: true
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 新功能
        - 改进现有功能
        - 界面和操作体验
        - 新的直播平台
        - 其他
    validations:
      required: true
  - type: dropdown
    id: clients
    attributes:
      label: 涉及的端
      multiple: true
      options:
        - Android 手机
        - Android 平板或折叠屏
        - Android 电视或盒子
        - Windows
        - Linux
        - macOS
        - iPhone
        - iPad
        - 所有端
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题和使用场景
      description: 现在你是怎么做的、哪里不方便、多久遇到一次。不要只写“加一个 XX 按钮”。
      placeholder: 晚上躺着看直播时，每次换台都要退出直播间回到关注列表再点进去，单手很难操作……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的做法
      description: 希望怎么用：在哪个页面、点什么、看到什么。可以附草图或别的应用的截图。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
      description: 现有功能能不能凑合解决；别的做法为什么不够好。
    validations:
      required: false
  - type: textarea
    id: reference
    attributes:
      label: 参考
      description: 3.x 里是怎么做的、平台官方 App 或其他应用的做法、相关链接。新平台请写平台官网和一个直播间链接。
    validations:
      required: false
  - type: dropdown
    id: importance
    attributes:
      label: 对你有多重要
      options:
        - 每天都会用到
        - 经常用到
        - 偶尔用到
        - 有了更好
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: 参与
      options:
        - label: 做好后我愿意帮忙试用（会在 issue 里请你试测试版）
          required: false
