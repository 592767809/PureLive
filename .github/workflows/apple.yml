# iOS, iPadOS and macOS builds on GitHub's macOS runners (D-041): the only
# build that is not made on our own machines, because they have no Mac.
# No Apple developer account, so nothing is signed by Apple:
#   - iOS: an unsigned IPA (AltStore / SideStore sign it with the user's own
#     Apple ID) and an ad-hoc signed IPA for TrollStore;
#   - macOS: the ad-hoc signed app as DMG and ZIP (first start: right-click →
#     Open, or System Settings → Privacy & Security → Open Anyway).
# Started by hand (Actions → Apple → Run workflow). Each run also starts the
# macOS app and the iOS app in the simulator and keeps a screenshot of each,
# so a build that cannot reach the home page is seen (PROCESS §11.4).
name: Apple

on:
  workflow_dispatch:
    inputs:
      ios:
        description: Build iOS / iPadOS
        type: boolean
        default: true
      macos:
        description: Build macOS
        type: boolean
        default: true
      simulator:
        description: Start the iOS app in the simulator and take a screenshot
        type: boolean
        default: true
      verify_run_id:
        description: Existing build run to verify without rebuilding (empty builds normally)
        type: string
        default: ''
      verify_source_sha:
        description: Exact source SHA required when verifying an existing run
        type: string
        default: ''
      native_playback_only:
        description: Run only the disposable native Mac playback probe
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}-${{ inputs.native_playback_only && 'native-playback' || 'full' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  apple:
    name: Apple
    if: ${{ inputs.verify_run_id == '' && !inputs.native_playback_only }}
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install official stable Python
        run: bash tools/toolchain/macos_python.sh

      - name: Toolchain
        id: toolchain
        run: |
          set -euo pipefail
          grep -E '^FLUTTER_VERSION=' toolchain.env >> "$GITHUB_ENV"
          bash tools/toolchain/apple.sh
          version=$(sed -n 's/^version: \([0-9.]*\)+\([0-9]*\)$/\1/p' apps/pure_live/pubspec.yaml)
          build=$(sed -n 's/^version: \([0-9.]*\)+\([0-9]*\)$/\2/p' apps/pure_live/pubspec.yaml)
          echo "name=PureLive-$version-$build" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Packages and native bundles
        run: |
          set -euo pipefail
          python3 tools/flutter_sdk/prepare.py --apply
          python3 tools/flutter_sdk/prepare.py --test
          flutter --version
          flutter pub get --enforce-lockfile
          bash tools/ffmpeg_kit/fetch.sh ios
          bash tools/ffmpeg_kit/fetch.sh macos

      # ---- macOS ----
      - name: Build macOS
        if: ${{ inputs.macos }}
        working-directory: apps/pure_live
        run: flutter build macos --release

      - name: Check and pack macOS
        if: ${{ inputs.macos }}
        run: |
          set -euo pipefail
          name="${{ steps.toolchain.outputs.name }}"
          app=apps/pure_live/build/macos/Build/Products/Release/PureLive.app
          test -x "$app/Contents/MacOS/PureLive"
          lipo -info "$app/Contents/MacOS/PureLive"
          find "$app/Contents/Frameworks" -maxdepth 1 -name '*.framework' | sort
          # Ad-hoc signature with the sandbox entitlements ("Sign to Run Locally").
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements - "$app"
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$app" "out/$name-macos-universal.zip"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          ditto "$app" "$stage/PureLive.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "纯粹直播" -srcfolder "$stage" -ov -format UDZO "out/$name-macos-universal.dmg"

      - name: Start macOS app
        if: ${{ inputs.macos }}
        run: |
          set -euo pipefail
          app=apps/pure_live/build/macos/Build/Products/Release/PureLive.app
          mkdir -p shots
          open "$app"
          sleep 40
          pgrep -x PureLive >/dev/null || { echo "PureLive stopped"; exit 1; }
          screencapture -x shots/macos.png
          # A18.2 c4 and c6, as far as a machine without a person can look:
          # the menu bar, the red button only hides the window, the Dock icon
          # (opening the app again) brings it back, quitting ends it.
          ui() { osascript -e "tell application \"System Events\" to tell process \"PureLive\" to $1" || echo "ui: not allowed: $1"; }
          ui 'click menu bar item 4 of menu bar 1'
          sleep 1
          screencapture -x shots/macos-menu.png
          ui 'key code 53'
          ui 'click (first button of window 1 whose subrole is "AXCloseButton")'
          sleep 3
          if pgrep -x PureLive >/dev/null; then echo "close: still running"; else echo "close: the app ENDED"; fi
          screencapture -x shots/macos-closed.png
          open "$app"
          sleep 4
          screencapture -x shots/macos-reopened.png
          osascript -e 'quit app "PureLive"' || true
          sleep 8
          if pgrep -x PureLive >/dev/null; then echo "quit: still RUNNING"; else echo "quit: ended"; fi
          log show --last 2m --predicate 'process == "PureLive" AND eventMessage CONTAINS[c] "flutter"' --style compact | tail -n 80 || true
          find "$HOME/Library/Containers/com.mystyle.pureLive" -name '*.log' -exec cp {} shots/ \; 2>/dev/null || true

      # ---- iOS / iPadOS ----
      - name: Build iOS
        if: ${{ inputs.ios }}
        working-directory: apps/pure_live
        run: flutter build ios --release --no-codesign

      - name: Pack iOS
        if: ${{ inputs.ios }}
        run: |
          set -euo pipefail
          name="${{ steps.toolchain.outputs.name }}"
          app=apps/pure_live/build/ios/iphoneos/Runner.app
          test -x "$app/Runner"
          lipo -info "$app/Runner"
          # The share extension (A18.1 c8) rides inside the app.
          test -x "$app/PlugIns/ShareExtension.appex/ShareExtension"
          plutil -p "$app/PlugIns/ShareExtension.appex/Info.plist" | grep -E 'CFBundleIdentifier|NSExtensionPointIdentifier|CFBundleShortVersionString'
          plutil -p "$app/Info.plist" | grep -A3 CFBundleURLSchemes
          find "$app/Frameworks" -maxdepth 1 -name '*.framework' | sort
          mkdir -p out
          pack() { # <app> <ipa>
            local work="$RUNNER_TEMP/ipa-$RANDOM"
            mkdir -p "$work/Payload"
            ditto "$1" "$work/Payload/Runner.app"
            (cd "$work" && zip -qry "$2" Payload)
          }
          # Unsigned: AltStore / SideStore sign it with the user's Apple ID.
          pack "$app" "$GITHUB_WORKSPACE/out/$name-ios-unsigned.ipa"
          # TrollStore: ad-hoc signed, inside out (frameworks, dylibs, app).
          ent="$RUNNER_TEMP/trollstore.plist"
          cat > "$ent" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>get-task-allow</key>
            <false/>
          </dict>
          </plist>
          PLIST
          signed="$RUNNER_TEMP/trollstore/Runner.app"
          mkdir -p "$(dirname "$signed")"
          ditto "$app" "$signed"
          while IFS= read -r item; do codesign -f -s - "$item"; done \
            < <(find "$signed" \( -name '*.framework' -o -name '*.dylib' \) -print)
          while IFS= read -r item; do codesign -f -s - --entitlements "$ent" "$item"; done \
            < <(find "$signed/PlugIns" -maxdepth 1 -name '*.appex' -print 2>/dev/null)
          codesign -f -s - --entitlements "$ent" "$signed"
          codesign --verify --deep --strict "$signed"
          pack "$signed" "$GITHUB_WORKSPACE/out/$name-ios-trollstore.ipa"

      - name: Start iOS app in the simulator
        if: ${{ inputs.ios && inputs.simulator }}
        working-directory: apps/pure_live
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ids = [d["udid"] for runtime, ds in sorted(devices.items(), reverse=True) if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(ids[0])')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$device" com.mystyle.purelive.liu
          sleep 60
          mkdir -p ../../shots
          # The newest runtime includes iPhone Duo with two displays. Select
          # its primary LCD explicitly instead of leaving simctl ambiguous.
          xcrun simctl io "$device" screenshot --display=1 ../../shots/ios-simulator.png
          # A18.1 c8: what the share extension opens (a room link) reaches
          # the app as a share.
          xcrun simctl openurl "$device" 'purelive-share://share?text=https%3A%2F%2Flive.bilibili.com%2F6' || true
          sleep 25
          xcrun simctl io "$device" screenshot --display=1 ../../shots/ios-share.png
          xcrun simctl spawn "$device" log show --last 2m --predicate 'process == "Runner" AND eventMessage CONTAINS[c] "flutter"' --style compact | tail -n 80 || true
          data=$(xcrun simctl get_app_container "$device" com.mystyle.purelive.liu data)
          find "$data" -name '*.log' -exec cp {} ../../shots/ \; 2>/dev/null || true

      - name: Native iOS recording kernel
        if: ${{ inputs.ios && inputs.simulator }}
        working-directory: apps/pure_live
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug --target test/native/recording_kernel_smoke.dart
          device=$(xcrun simctl list devices booted -j | python3 -c '
          import json,sys
          ids=[d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")]
          assert len(ids)==1,ids
          print(ids[0])')
          xcrun simctl terminate "$device" com.mystyle.purelive.liu || true
          xcrun simctl install "$device" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$device" com.mystyle.purelive.liu
          data=$(xcrun simctl get_app_container "$device" com.mystyle.purelive.liu data)
          proof="$data/tmp/purelive-recording-kernel-smoke"
          for attempt in $(seq 1 60); do
            [[ -f "$proof/result.json" ]] && break
            sleep 2
          done
          mkdir -p ../../shots/ios-recording-kernel
          cp -R "$proof/." ../../shots/ios-recording-kernel/
          python3 -c 'import json; v=json.load(open("../../shots/ios-recording-kernel/result.json")); print(v); assert v["passed"] and v["operating_system"]=="ios"'
          xcrun simctl terminate "$device" com.mystyle.purelive.liu

      - name: Native macOS recording kernel
        if: ${{ inputs.macos }}
        working-directory: apps/pure_live
        run: |
          set -euo pipefail
          flutter build macos --debug --target test/native/recording_kernel_smoke.dart
          binary="$PWD/build/macos/Build/Products/Debug/PureLive.app/Contents/MacOS/PureLive"
          mkdir -p ../../shots/macos-recording-kernel
          "$binary" > ../../shots/macos-recording-kernel/stdout.log 2> ../../shots/macos-recording-kernel/stderr.log &
          owned_pid=$!
          stop_owned() {
            if kill -0 "$owned_pid" 2>/dev/null; then
              actual=$(ps -ww -p "$owned_pid" -o command= | sed 's/^[[:space:]]*//')
              [[ "$actual" = "$binary" ]] || { echo 'Native smoke process identity changed'; return 1; }
              kill -TERM "$owned_pid" 2>/dev/null || true
              for attempt in $(seq 1 5); do
                kill -0 "$owned_pid" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$owned_pid" 2>/dev/null; then
                actual=$(ps -ww -p "$owned_pid" -o command= | sed 's/^[[:space:]]*//')
                [[ "$actual" = "$binary" ]] || { echo 'Native smoke process identity changed'; return 1; }
                kill -KILL "$owned_pid" 2>/dev/null || true
              fi
              wait "$owned_pid" 2>/dev/null || true
            fi
          }
          trap stop_owned EXIT
          # macOS sandbox redirects NSTemporaryDirectory into its container.
          for attempt in $(seq 1 60); do
            proof=$(find "$HOME/Library/Containers/com.mystyle.pureLive" "${TMPDIR:-/tmp}" -path '*/purelive-recording-kernel-smoke/result.json' -print -quit 2>/dev/null || true)
            [[ -n "$proof" ]] && break
            sleep 2
          done
          test -n "$proof"
          cp -R "$(dirname "$proof")/." ../../shots/macos-recording-kernel/
          python3 -c 'import json; v=json.load(open("../../shots/macos-recording-kernel/result.json")); print(v); assert v["passed"] and v["operating_system"]=="macos"'

      - name: Native macOS occlusion and minimized playback
        if: ${{ inputs.macos }}
        run: bash tools/release/check_macos_playback.sh

      - name: Checksums
        if: ${{ always() }}
        run: |
          mkdir -p out shots
          (cd out && shasum -a 256 * > SHA256SUMS.txt 2>/dev/null || true; cat SHA256SUMS.txt || true)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: ${{ steps.toolchain.outputs.name }}-apple
          path: out/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
          retention-days: 14


  native-playback-probe:
    name: Native Mac playback probe
    if: ${{ inputs.native_playback_only }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install official stable Python
        run: bash tools/toolchain/macos_python.sh
      - name: Probe toolchain
        run: |
          set -euo pipefail
          grep -E '^FLUTTER_VERSION=' toolchain.env >> "$GITHUB_ENV"
          bash tools/toolchain/apple.sh
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Probe dependencies
        run: |
          set -euo pipefail
          python3 tools/flutter_sdk/prepare.py --apply
          python3 tools/flutter_sdk/prepare.py --test
          flutter pub get --enforce-lockfile
          bash tools/ffmpeg_kit/fetch.sh macos
      - name: Native macOS occlusion and minimized playback
        run: bash tools/release/check_macos_playback.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: native-playback-probe
          path: shots/
          if-no-files-found: warn
          retention-days: 14

  macos-package-check:
    name: Exact Mac package startup (${{ matrix.replica }})
    needs: apple
    if: ${{ always() && !inputs.native_playback_only && inputs.macos && (needs.apple.result == 'success' || inputs.verify_run_id != '') }}
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install official stable Python
        run: bash tools/toolchain/macos_python.sh
      - name: Verify stable Apple toolchain
        run: bash tools/toolchain/apple.sh
      - name: Download this run's exact packages
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.verify_run_id || github.run_id }}
          EXPECTED_SOURCE: ${{ inputs.verify_source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          actual_source=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          test "$actual_source" = "$EXPECTED_SOURCE"
          printf 'build_run_id=%s\nsource_commit=%s\n' "$RUN_ID" "$actual_source" > build-identity.txt
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern '*-apple' --dir packages
          dir=$(dirname "$(find packages -name SHA256SUMS.txt -print -quit)")
          (cd "$dir" && shasum -a 256 -c SHA256SUMS.txt)
      - name: Observe first launch and reopen without modifying the bundle
        run: |
          set -euo pipefail
          archives=(packages/*/PureLive-*-macos-universal.zip)
          test "${#archives[@]}" = 1
          bash tools/release/verify_macos_startup.sh "${archives[0]}" package-shots
          cp build-identity.txt package-shots/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: macos-package-startup-${{ matrix.replica }}
          path: package-shots/
          if-no-files-found: error
          retention-days: 14
